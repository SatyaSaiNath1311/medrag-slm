# Single source of truth for the whole project. Every number lives here.
seed: 42

smoke_test:
  max_new_tokens: 32

models:
  - name: qwen3-1.7b
    id: Qwen/Qwen3-1.7B
    dtype: float16
  - name: gemma3-4b
    id: google/gemma-3-4b-it
    dtype: float32      # float16 overflows on T4 (smoke test: NaN logits). float32 uses both T4 GPUs.
    loader: gemma3
    kaggle_path_glob: "/kaggle/input/gemma-3/transformers/gemma-3-4b-it/*"
    kaggle_handle: "google/gemma-3/transformers/gemma-3-4b-it"
    batch_size_rag: 2   # float32 on 2x T4 (28 GB total) OOMs at batch 8 during RAG; 2 is safe
  - name: phi4-mini
    id: microsoft/Phi-4-mini-instruct
    dtype: float16
  - name: qwen3-4b
    id: Qwen/Qwen3-4B
    dtype: float16
  - name: smollm3-3b
    id: HuggingFaceTB/SmolLM3-3B
    dtype: float16
  - name: medpsy-4b
    id: qvac/MedPsy-4B
    dtype: float16
    reasoning: true
    max_new_tokens_reasoning: 1024
    batch_size: 8
  - name: medpsy-1.7b
    id: qvac/MedPsy-1.7B
    dtype: float16
    reasoning: true
    max_new_tokens_reasoning: 1024
    batch_size: 8
  - name: qwen3-1.7b-thinking
    id: Qwen/Qwen3-1.7B
    dtype: float16
    reasoning: true
    max_new_tokens_reasoning: 1024
    batch_size: 8
  - name: qwen3-4b-thinking-2507
    id: Qwen/Qwen3-4B-Thinking-2507
    dtype: float16
    reasoning: true
    max_new_tokens_reasoning: 1024
    batch_size: 8
  - name: medgemma-1.5-4b-it
    id: google/medgemma-1.5-4b-it
    dtype: float32
    loader: gemma3
    gated: true
    kaggle_path_glob: "/kaggle/input/medgemma-1-5/transformers/medgemma-1.5-4b-it/*"
    kaggle_handle: "google/medgemma-1-5/transformers/medgemma-1.5-4b-it"
    batch_size_rag: 2


# Used only for quick local checks on your laptop (CPU), never for results.
tiny_model:
  name: qwen3-0.6b
  id: Qwen/Qwen3-0.6B
  dtype: float32

# ---------------- Phase 1: datasets ----------------
data:
  medqa_hf: GBaker/MedQA-USMLE-4-options
  pubmedqa_hf: qiaojin/PubMedQA
  pubmedqa_config: pqa_labeled
  sizes:      {medqa_test: 500, medqa_val: 200, pubmedqa_test: 500, pubmedqa_val: 200, unans_test: 150, unans_val: 50}
  tiny_sizes: {medqa_test: 10, medqa_val: 5, pubmedqa_test: 10, pubmedqa_val: 5, unans_test: 5, unans_val: 3}

# ---------------- Phase 2: knowledge base ----------------
corpus:
  hf: MedRAG/textbooks
  min_words: 20
  min_docs: 100000        # full corpus has ~125k snippets; fewer means the download went wrong
  tiny_rows: 2000
  tiny_min_docs: 500

# ---------------- Phase 3: indexing ----------------
index:
  max_words: 350
  overlap_words: 50
  article_encoder: ncbi/MedCPT-Article-Encoder
  query_encoder: ncbi/MedCPT-Query-Encoder
  article_max_length: 512
  query_max_length: 512
  batch_size: 64

# ---------------- Phase 6: retrieval ----------------
retrieval:
  include_options: true
  dense_k: 50
  bm25_k: 50
  rrf_k: 60
  top_k: 20

# ---------------- Phase 7: reranking ----------------
rerank:
  cross_encoder: ncbi/MedCPT-Cross-Encoder
  max_length: 512
  batch_size: 32
  top_k: 5

# ---------------- Phases 4, 5, 8: question answering ----------------
qa:
  batch_size: 8
  max_new_tokens_baseline: 16
  max_new_tokens_rag: 40
  passage_max_chars: 1200
  check_questions: 20
  min_parse_rate: 0.9
  tiny_min_parse_rate: 0.5
  tiny_questions: 3

# ---------------- V3: Matched-Pair Generic vs Medical Experiment ----------------
v3:
  seed: 42
  thinking_cap: 1024
  truncation_caps: [1024, 2048]
  truncation_sensitivity_n: 100
  pilot_n: 50
  conditions: ["C1", "C2", "C3", "C4", "C5"]
  pairs:
    P1:
      name: "1.7B (Qwen)"
      generic: "qwen3-1.7b"
      medical: "medpsy-1.7b"
      control: "qwen3-1.7b-thinking"
    P2:
      name: "4B (Qwen)"
      generic: "qwen3-4b"
      medical: "medpsy-4b"
      control: "qwen3-4b-thinking-2507"
    P3:
      name: "4B (Gemma)"
      generic: "gemma3-4b"
      medical: "medgemma-1.5-4b-it"
      control: null

